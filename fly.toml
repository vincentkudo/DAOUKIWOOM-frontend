app = "roomflow-dkw-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_API_URL = "https://roomflow-dkw-api.fly.dev"
    NGINX_CONF = "nginx.fly.conf"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
